<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#059669">
<title>Emprende365 — Acceso protegido</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--verde:#059669;--verde2:#047857;--verde-claro:#ecfdf5;--verde-borde:#6ee7b7;--rojo:#dc2626;--texto:#0f172a;--texto2:#475569;--gris3:#e2e8f0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background-color:#ecfdf5;background-image:radial-gradient(at 40% 20%,hsla(151,72%,90%,1) 0px,transparent 50%),radial-gradient(at 80% 0%,hsla(189,70%,90%,1) 0px,transparent 50%),radial-gradient(at 0% 100%,hsla(151,72%,90%,1) 0px,transparent 50%);
  padding:20px;color:var(--texto)}
.card{background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border:1px solid rgba(110,231,183,.4);border-radius:20px;box-shadow:0 20px 60px rgba(5,150,105,.12);max-width:420px;width:100%;padding:36px 30px;text-align:center}
.lock{width:56px;height:56px;border-radius:14px;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 18px;box-shadow:0 8px 20px rgba(5,150,105,.35)}
h1{font-size:19px;font-weight:800;margin-bottom:6px}
p.sub{font-size:13px;color:var(--texto2);margin-bottom:22px;line-height:1.5}
input[type=password]{width:100%;padding:13px 14px;border:1.5px solid var(--gris3);border-radius:10px;font-size:15px;font-family:inherit;margin-bottom:12px;outline:none;transition:border-color .15s}
input[type=password]:focus{border-color:var(--verde)}
button{width:100%;padding:13px;border:none;border-radius:10px;background:var(--verde);color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s}
button:hover{background:var(--verde2)}
button:disabled{opacity:.6;cursor:default}
.err{color:var(--rojo);font-size:12px;font-weight:600;margin-top:10px;display:none}
.err.show{display:block;animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.foot{font-size:10px;color:#94a3b8;margin-top:22px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <div class="lock">🔒</div>
  <h1>Emprende365 — Simulador de Negocios</h1>
  <p class="sub">Este contenido está en fase de valoración institucional.<br>Ingresa la clave de acceso para continuar.</p>
  <input type="password" id="clave" placeholder="Clave de acceso" autofocus>
  <button id="btn" onclick="intentar()">Entrar</button>
  <div class="err" id="err">Clave incorrecta. Intenta de nuevo.</div>
  <div class="foot">UAEMéx · Dirección de Desarrollo Empresarial<br>Contenido cifrado — no visible sin la clave correcta.</div>
</div>

const ITER     = 150000;

function b64ToBuf(b64){
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  return buf;
}

async function derivarClave(password, saltBuf){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt: saltBuf, iterations: ITER, hash:'SHA-256' },
    baseKey,
    { name:'AES-GCM', length:256 },
    false,
    ['decrypt']
  );
}

async function intentar(){
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  const pass = document.getElementById('clave').value;
  err.classList.remove('show');
  if(!pass){ return; }
  btn.disabled = true; btn.textContent = 'Verificando...';
  try{
    const salt = b64ToBuf(SALT_B64);
    const iv = b64ToBuf(IV_B64);
    const ct = b64ToBuf(CT_B64);
    const key = await derivarClave(pass, salt);
    const plainBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ct);
    const html = new TextDecoder().decode(plainBuf);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    btn.disabled = false; btn.textContent = 'Entrar';
    err.classList.add('show');
  }
}

document.getElementById('clave').addEventListener('keydown', e=>{ if(e.key==='Enter') intentar(); });
</script>
